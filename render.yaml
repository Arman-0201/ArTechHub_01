# Render Blueprint — Academy Platform API
# Dashboard: New → Blueprint → pick this repo. Values marked `sync: false`
# must be filled in the Render dashboard (they are secrets or depend on the
# URLs Render/Vercel hand out after the first deploy).
services:
  - type: web
    name: artechhub-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    healthCheckPath: /health
    # --include=dev is required: NODE_ENV=production below makes npm default to
    # omit=dev, which would strip the prisma CLI, typescript and tsx from the
    # install and leave nothing to build or seed with.
    buildCommand: npm ci --include=dev && npm run build:packages && npm run db:generate && npm run build --workspace @academy/api
    startCommand: npm run db:deploy --workspace @academy/api && npm run start:api
    envVars:
      - key: NODE_VERSION
        value: "20.11.0"
      - key: NODE_ENV
        value: production
      # Render routes external traffic to the port it exposes as PORT (10000).
      - key: API_PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "1"

      # --- URLs (fill after the first deploy / after Vercel gives you a domain)
      - key: API_PUBLIC_URL
        sync: false
      - key: WEB_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # --- Database (Neon / Supabase / Render Postgres)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Auth secrets: 3 DIFFERENT values, each >= 32 chars
      # node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TOKEN_PEPPER_SECRET
        sync: false

      # Frontend and API live on different sites -> cookies must be cross-site.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      # Must be the parent domain shared by the web app and the API, with a
      # leading dot (e.g. .example.com). Server-side rendering reads the refresh
      # cookie off the incoming request, so on unrelated hosts
      # (*.vercel.app + *.onrender.com) the cookie never reaches the Next server
      # and every authenticated page redirects to the login screen.
      - key: COOKIE_DOMAIN
        sync: false

      # --- Mail: `console` is rejected in production (config/env.ts)
      - key: MAIL_TRANSPORT
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # --- Storage: Render's disk is ephemeral, so uploads need S3-compatible
      # storage (Cloudflare R2 / Supabase Storage / Backblaze B2).
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_PUBLIC_URL
        sync: false

      # --- First Super Admin, created by `npm run db:seed`
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
